          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Eras</text></g>
  <g transform="translate(302 502)"><rect x="0" y="0" width="132" height="74" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="66" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">60</text>
          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Concepts</text></g>
  <g transform="translate(454 502)"><rect x="0" y="0" width="132" height="74" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="66" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">96</text>
          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Sources</text></g>
  <g transform="translate(606 502)"><rect x="0" y="0" width="132" height="74" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="66" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">6</text>
          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Flowcharts</text></g>
  <g transform="translate(758 502)"><rect x="0" y="0" width="132" height="74" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="66" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">11</text>
          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Chapters</text></g>
  <g transform="translate(910 502)"><rect x="0" y="0" width="132" height="74" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <text x="66" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">90+</text>
          <text x="66" y="56" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Years</text></g>

    <!-- mode cards -->
    <g transform="translate(150 604)"><rect x="0" y="0" width="300" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <rect x="16" y="18" width="32" height="32" rx="10" fill="url(#brand)" fill-opacity="0.25"/>
