          <rect x="60" y="42" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/></g>
  <g transform="translate(470 604)"><rect x="0" y="0" width="300" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <rect x="16" y="18" width="32" height="32" rx="10" fill="url(#brand)" fill-opacity="0.25"/>
          <text x="60" y="30" font-size="13" font-weight="600" fill="#ffffff">Knowledge Graph</text>
          <rect x="60" y="42" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/></g>
  <g transform="translate(790 604)"><rect x="0" y="0" width="300" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <rect x="16" y="18" width="32" height="32" rx="10" fill="url(#brand)" fill-opacity="0.25"/>
          <text x="60" y="30" font-size="13" font-weight="600" fill="#ffffff">Structured Course</text>
          <rect x="60" y="42" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/></g>
  <g transform="translate(150 688)"><rect x="0" y="0" width="300" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <rect x="16" y="18" width="32" height="32" rx="10" fill="url(#brand)" fill-opacity="0.25"/>
          <text x="60" y="30" font-size="13" font-weight="600" fill="#ffffff">Visual Flowcharts</text>
          <rect x="60" y="42" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/></g>
  <g transform="translate(470 688)"><rect x="0" y="0" width="300" height="68" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
          <rect x="16" y="18" width="32" height="32" rx="10" fill="url(#brand)" fill-opacity="0.25"/>
          <text x="60" y="30" font-size="13" font-weight="600" fill="#ffffff">Source Library</text>
          <rect x="60" y="42" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/></g>
