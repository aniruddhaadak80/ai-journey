<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#050508"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  
  <g transform="translate(68 74) scale(1.4)">
    <path d="M0 34 C 10 34, 12 16, 22 16 S 34 10, 42 6"
          fill="none" stroke="url(#brand)" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="0" cy="34" r="4.4" fill="#22d3ee"/>
    <circle cx="22" cy="16" r="5.4" fill="#a855f7"/>
    <circle cx="42" cy="6" r="4" fill="#ec4899"/>
    <path d="M30 0 l2.4 6 L38 8.4 l-5.6 2.4 L30 16.8 l-2.4 -6 L22 8.4 l5.6 -2.4 Z" fill="#c4b5fd"/>
  </g>
  
  <g transform="translate(168 84)" font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <text y="34" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AI Journey</text>
    <text y="55" font-size="15" fill="rgba(255,255,255,0.5)">The complete interactive history of AI</text>
  </g>

  <text x="68" y="300" font-family="'Segoe UI', Inter, sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-2.5">The Journey to AI</text>
  <text x="68" y="356" font-family="'Segoe UI', Inter, sans-serif" font-size="27" fill="rgba(255,255,255,0.6)">One interactive experience — timeline, knowledge graph, course,</text>
  <text x="68" y="394" font-family="'Segoe UI', Inter, sans-serif" font-size="27" fill="rgba(255,255,255,0.6)">flowcharts, and every source paper, video and essay linked.</text>

  <g transform="translate(68 460)">
        <rect width="110" height="46" rx="23" fill="url(#brand)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.35"/>
        <text x="55" y="30" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" fill="#cffafe">12 Eras</text>
      </g>
  <g transform="translate(288 460)">
        <rect width="150" height="46" rx="23" fill="url(#brand)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.35"/>
        <text x="75" y="30" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" fill="#cffafe">60 Concepts</text>
      </g>
  <g transform="translate(508 460)">
        <rect width="140" height="46" rx="23" fill="url(#brand)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.35"/>
        <text x="70" y="30" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" fill="#cffafe">96 Sources</text>
      </g>
  <g transform="translate(728 460)">
        <rect width="150" height="46" rx="23" fill="url(#brand)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.35"/>
        <text x="75" y="30" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" fill="#cffafe">11 Chapters</text>
      </g>
  <g transform="translate(948 460)">
        <rect width="160" height="46" rx="23" fill="url(#brand)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.35"/>
        <text x="80" y="30" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" fill="#cffafe">6 Flowcharts</text>
      </g>

  <text x="68" y="576" font-family="'Segoe UI', Inter, sans-serif" font-size="19" fill="rgba(255,255,255,0.4)">1936 Turing Machine → 1956 Dartmouth → 2012 AlexNet → 2017 Transformer → 2025 Agents</text>
</svg>
