name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (content · svg · types · lint · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catches dangling foreign keys in the dataset — the failure mode that
      # silently renders an empty section instead of an error.
      - name: Validate content integrity
        run: bun run validate

      # Catches malformed SVG that would silently break README images.
      - name: Validate SVG assets
        run: bun run validate:svg

      # Catches malformed mermaid that would silently break README diagrams.
      - name: Validate mermaid diagrams
        run: bun run validate:mermaid

      # Guards against pushing credentials to a public repo.
      - name: Scan for secrets
        run: bun run scan:secrets

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  smoke:
    name: Smoke test the production server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start production server
        run: bun run start &
          sleep 12

      # Asserts each route's server-rendered HTML contains real content and
      # that the SEO surface (canonical, OG, sitemap, robots, icon) is present.
      - name: Smoke test routes
        run: bun run smoke
