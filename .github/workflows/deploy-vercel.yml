name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun's install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel build --prod --token "$VERCEL_TOKEN"
          # A team over its Vercel fair-use limit is blocked at the account
          # level: every deploy exits non-zero with "exceeded our fair use
          # limits and has been blocked" even though the build is fine. Report
          # that as a warning instead of a red main, and let the next push try
          # again once the block clears.
          set +e
          bunx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -qiE "fair use limits|has been blocked" deploy.log; then
            echo "::warning::Vercel blocked this team at the account level (fair-use limit); the build is fine and the deploy will be retried on the next push"
            exit 0
          fi
          exit "$status"
